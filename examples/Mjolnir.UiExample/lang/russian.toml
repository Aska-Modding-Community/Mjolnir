# Окно Mjolnir: строка мода в списке, заголовки разделов настроек ([sections] <раздел>) и строки настроек
# ([config.<раздел>.<ключ>] name и description). Без перевода окно показывает тексты из кода.
[mod]
description = "Все элементы Mjolnir.SDK.UI, построенные в коде."

[sections]
HUD = "Строка в HUD"
Banner = "Баннер"
Keys = "Клавиши"

[config.HUD.ShowText]
name = "Показывать строку в HUD"
description = "Показывать строку примера в HUD."

[config.HUD.Text]
name = "Текст строки"
description = "Что написано в строке HUD."

[config.Banner.Seconds]
name = "Секунды баннера"
description = "Сколько держится приветственный баннер."

[config.Keys.Window]
name = "Клавиша окна"
description = "Открывает и закрывает окно примера."

# Имена значений перечисления ExampleWindow.Difficulty в селекторе: ключ <тип>.<значение>.
