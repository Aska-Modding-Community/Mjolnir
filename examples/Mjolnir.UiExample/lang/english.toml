# The UI example's texts in English, the fallback of every language without a file of its own (the SDK's Localization).
# A file per language next to the mod's .dll, named by Steam's language name (russian.toml) or a code (ru.toml).
# Keys nest with dots: [section] form is the key "section.form". An enum's items show their names unless a file names
# them: [Difficulty] in russian.toml. The Mods window's texts ([mod], [sections], [config.<section>.<key>]) are those
# of the code here (WithDisplayName, the descriptions); russian.toml translates them.

intro = "This window is a game menu: the player stands still, the cursor is free and Esc closes it."
marker = "Where the world was loaded"
hud.key = "The example's window"
banner.ready = "The world is ready"

[section]
form = "A simple form"
controls = "Controls"
layout = "Layout"
messages = "Messages"
more = "More controls"
sizes = "Sizes"

[message]
hello = "Hello from UI Example"
