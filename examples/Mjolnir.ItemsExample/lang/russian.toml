# Тексты Items Example на русском.

[mod]
name = "Items Example"
description = "Предметы, рецепты и постройка мода."

[item.twine]
name = "Бечёвка"
description = "Тонкий шнур, скрученный из волокон верёвки. Легче верёвки, в одну ячейку помещается двадцать."
lore = "Смотана в моток, чтобы не путалась: потяни за свободный конец, и отмотаешь, сколько нужно."

[item.twine_spool]
name = "Катушка бечёвки"
description = "Пять бечёвок, намотанных на палку; делается в мастерской. В одну ячейку помещается десять катушек."
lore = "В мастерской бечёвку держат на катушках, чтобы была под рукой для следующей обвязки."

[building.twine_arch]
name = "Арка из бечёвки"
description = "Украшение"
lore = "Два столба и согнутый верх, связанные бечёвкой вместо верёвки. Держится не хуже, а бечёвки не так жалко."
