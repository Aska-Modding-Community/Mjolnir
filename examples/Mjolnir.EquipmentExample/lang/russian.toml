# Тексты Equipment Example на русском.

[mod]
name = "Equipment Example"
description = "Оружие, броня и еда мода."

[item.rune_sword]
name = "Рунный меч"
description = "Одноручный меч с вырезанными рунами огня. Иногда удар поджигает цель."
lore = "Кузнец клялся, что руны только для красоты. Опалённый фартук говорит иное."

[item.rune_hood]
name = "Рунный капюшон"
description = "Плотный капюшон, расшитый рунами. Защищает от холода и придаёт сил."
lore = "Соткан в самую долгую ночь года у огня, которому не давали погаснуть."

[item.honey_cake]
name = "Медовый пирог"
description = "Сладкий пирог на меду. На время придаёт бодрости тому, кто его съест."
lore = "Пекут к праздникам, а съедают задолго до них."
